<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Predictions</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    margin:0;
    padding:40px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2a5298;
    color:white;
    padding:12px;
    text-align:center;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f5f5;
}

a{
    text-decoration:none;
    padding:6px 12px;
    border-radius:4px;
    font-size:14px;
}

.edit{
    background:#4CAF50;
    color:white;
}

.delete{
    background:#f44336;
    color:white;
}

.edit:hover{
    background:#3e8e41;
}

.delete:hover{
    background:#d32f2f;
}

</style>

</head>
<body>

<div class="container">

<h2>Loan Prediction List</h2>

<table>

<tr>
<th>Loan ID</th>
<th>Income</th>
<th>Loan Amount</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for loan in loans %}

<tr>
<td>{{loan.loan_id}}</td>
<td>{{loan.income_annum}}</td>
<td>{{loan.loan_amount}}</td>
<td>{{loan.loan_status}}</td>

<td>
<a class="edit" href="{% url 'edit_prediction' loan.id %}">Edit</a>
<a class="delete" href="{% url 'delete_prediction' loan.id %}">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
