<!DOCTYPE html>
<html>
<head>
    <title>Bank AI - Loan Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2a5298;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 40%;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 55%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e3c72;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .approved {
            color: green;
        }

        .rejected {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Loan Prediction System</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Loan ID</label>
            <input type="number" name="loan_id" required>
        </div>

        <div class="form-group">
            <label>No of Dependents</label>
            <input type="number" name="no_of_dependents" required>
        </div>

        <div class="form-group">
            <label>Education</label>
            <select name="education" required>
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>
        </div>

        <div class="form-group">
            <label>Self Employed</label>
            <select name="self_employed" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Income per Annum</label>
            <input type="number" name="income_annum" required>
        </div>

        <div class="form-group">
            <label>Loan Amount</label>
            <input type="number" name="loan_amount" required>
        </div>

        <div class="form-group">
            <label>Loan Term</label>
            <input type="number" name="loan_term" required>
        </div>

        <div class="form-group">
            <label>CIBIL Score</label>
            <input type="number" name="cibil_score" required>
        </div>

        <div class="form-group">
            <label>Residential Assets Value</label>
            <input type="number" name="residential_assets_value" required>
        </div>

        <div class="form-group">
            <label>Commercial Assets Value</label>
            <input type="number" name="commercial_assets_value" required>
        </div>

        <div class="form-group">
            <label>Luxury Assets Value</label>
            <input type="number" name="luxury_assets_value" required>
        </div>

        <div class="form-group">
            <label>Bank Asset Value</label>
            <input type="number" name="bank_asset_value" required>
        </div>

        <button type="submit">Check Loan Status</button>
       
    </form>

    {% if prediction %}
        <div class="result 
            {% if prediction == 'Approved' %}approved{% else %}rejected{% endif %}">
            Loan Status: {{ prediction }}
        </div>
     {% endif %}
    
    {% if prediction %}

<h2>Loan Status: {{ prediction }}</h2> 

<a href="{% url 'prediction_list' %}">
    <button style="padding:10px 20px; background-color:#1e3a8a; color:white; border:none; border-radius:5px;">
        View All Predictions
    </button>
</a>

{% endif %}
</div>

</body>
</html>
